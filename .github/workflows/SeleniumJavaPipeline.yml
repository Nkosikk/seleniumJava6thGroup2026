name: Selenium Java Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        run: mvn clean test -Dheadless=true

      - name: Upload Selenium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: NdosiReports/


      - name: Send Email with Emailable Report Attachment
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server configuration
          server_address: smtp.gmail.com                    # Gmail SMTP server
          server_port: 587                                  # TLS secure connection port
          # Authentication credentials (stored in GitHub secrets for security)
          username: ${{ secrets.EMAIL_USERNAME }}           # Gmail account email
          password: ${{ secrets.EMAIL_PASSWORD }}           # Gmail app-specific password
          # Email content
          subject: Selenium Automation Test Results - Report for CI/CD Group  # Email subject line
          to: fitness.seed@gmail.com                        # Recipient email address
          from: ${{ secrets.EMAIL_USERNAME }}               # Sender email address
          # Message body with test execution details and formatting
          body: |
            Hi Team,

            ═══════════════════════════════════════════════════════════
                          TEST EXECUTION REPORT
            ═══════════════════════════════════════════════════════════

            Repository  :  ${{ github.repository }}
            Branch      :  ${{ github.ref_name }}
            Commit      :  ${{ github.sha }}
            Run Number  :  ${{ github.run_number }}
            Triggered by:  ${{ github.actor }}
            Status      :  COMPLETED

            ───────────────────────────────────────────────────────────

            Please find the report attached to this email.

            For more details, visit:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Kind Regards,
            Team Lead

          attachments: NdosiReports/NdosiTestAutomation.html

